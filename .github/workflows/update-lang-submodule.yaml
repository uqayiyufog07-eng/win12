name: Update Lang Files

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: update-lang-files
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 语言文件原为 Git 子模块，为支持 Cloudflare 部署已内联为普通文件，
      # 因此这里改为直接从上游仓库同步内容。
      - name: Fetch upstream locales
        run: |
          git clone --depth 1 https://github.com/win12-online/win12-locales.git /tmp/win12-locales

      - name: Sync language files
        run: |
          mkdir -p lang/lang
          cp /tmp/win12-locales/lang/*.properties lang/lang/
          cp /tmp/win12-locales/LICENSE          lang/LICENSE
          cp /tmp/win12-locales/TRANSLATORS      lang/TRANSLATORS

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lang
          git diff --cached --quiet && exit 0
          git commit -m "chore: update lang files from upstream locales"
          git pull --rebase origin main
          git push
